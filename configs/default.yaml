paths:
  images_dir: "./data/imgs"
  masks_dir: "./data/masks"
  out_dir: "./runs/unet"

data:
  img_size: 256
  val_frac: 0.30
  batch_size: 8
  num_workers: 0
  pin_memory: false
  augment: true

model:
  in_ch: 3
  out_ch: 1
  base: 64

optim:
  name: "adamw"
  lr: 1.0e-3
  weight_decay: 1.0e-4

train:
  epochs: 25
  amp: true
  device: "cuda"   # "cuda" or "cpu"
  best_ckpt: "unet_best.pt"
  save_every: 0    # 0 = only best

metrics:
  threshold: 0.5
seed: 42
